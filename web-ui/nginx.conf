server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Static web UI
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: same-origin proxy to the API. LLM generation is slow, so timeouts are long.
    # The current index.html calls the API directly on port 8077, so this only takes effect
    # if you point API_BASE at '' (same origin). Variable + resolver lets nginx start even
    # when api-server isn't up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api-server:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        client_max_body_size 5m;
    }

    error_log /dev/stderr;
    access_log /dev/stdout;
}
